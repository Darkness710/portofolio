
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-24}

    container_name: astro-portofolio

    ports:
      - "4321:4321"

    volumes:
      - .:/app
      - node_modules:/app/node_modules

    restart: unless-stopped

volumes:
  node_modules:
